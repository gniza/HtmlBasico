<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            color: #1c2430;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #ff8b1f;
        }
        form {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }
        textarea {
            width: 100%;    
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #c9ced6;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            background-color: #1c2430;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ff9100;
            color: #1c2430;
        }

        
    </style>
</head>

<body>

    <h1>Formulário</h1>

    <form>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome">
        <br><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email">
        <br><br>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha">
        <br><br>

        <label for="nascimento">Data de nascimento:</label>
        <input type="date" id="nascimento" name="nascimento">
        <br><br>

        <label for="curso">Curso:</label>
        <select id="curso" name="curso">
            <option value="">Selecione</option>
            <option value="ads">Análise e Desenvolvimento de Sistemas</option>
            <option value="cc">Ciência da Computação</option>
            <option value="si">Sistemas de Informação</option>
            <option value="ec">Engenharia de Software</option>
        </select>
        <br><br>

        <p>Sexo:</p>
        <input type="radio" id="masculino" name="sexo" value="masculino">
        <label for="masculino">Masculino</label>
        <input type="radio" id="feminino" name="sexo" value="feminino">
        <label for="feminino">Feminino</label>
        <input type="radio" id="outro" name="sexo" value="outro">
        <label for="outro">Outro</label>
        <br><br>

        <p>Interesses:</p>
        <input type="checkbox" id="programacao" name="interesses" value="programacao">
        <label for="programacao">Programação</label>
        <input type="checkbox" id="design" name="interesses" value="design">
        <label for="design">Design</label>
        <input type="checkbox" id="redes" name="interesses" value="redes">
        <label for="redes">Redes</label>
        <input type="checkbox" id="jogos" name="interesses" value="jogos">
        <label for="jogos">Jogos</label>
        <br><br>

        <label for="comentarios">Comentários:</label>
        <br>
        <textarea id="comentarios" name="comentarios" rows="5" cols="40"></textarea>
        <br><br>

        <label for="foto">Upload de foto:</label>
        <input type="file" id="foto" name="foto" accept="image/*">
        <br><br>

        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
    </form>

</body>
</html>
